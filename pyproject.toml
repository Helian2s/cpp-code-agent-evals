[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-code-agent-evals"
version = "0.1.0"
description = "External benchmark harness for cpp-code-agent on C++ SWE-bench tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.adapters"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
